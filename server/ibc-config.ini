# IBC-configuratie voor automatisch inloggen op IB Gateway.
# Vul IbLoginId en IbPassword in. Paper trading: de aparte paper-gebruikersnaam uit het Client Portal
# (Settings > Paper Trading Account) en TradingMode=paper. Echt geld: je gewone login en TradingMode=live.
# Dit bestand is alleen leesbaar voor de bot-gebruiker (chmod 600).

IbLoginId=
IbPassword=
TradingMode=paper

# Tweestapsverificatie via IBKR Mobile: IBC wacht tot je de melding op je telefoon goedkeurt.
SecondFactorDevice=
ReloginAfterSecondFactorAuthenticationTimeout=yes
SecondFactorAuthenticationTimeout=180
ExitAfterSecondFactorAuthenticationTimeout=no

# API-instellingen (poort 4002 paper, 4001 live; de bot leest IB_PORT uit /etc/rotatiebot/env)
OverrideTwsApiPort=4002
ReadOnlyApi=no
AcceptNonBrokerageAccountWarning=yes
AcceptIncomingConnectionAction=accept
AllowBlindTrading=yes
TrustedTwsApiClientIPs=127.0.0.1

# Overig
ExistingSessionDetectedAction=primary
ClosedownAt=
AutoRestartTime=
MinimizeMainWindow=no
BypassWarningPrompts=yes
SendMarketDataInLotsForUSstocks=no
